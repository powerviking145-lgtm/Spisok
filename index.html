<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cart Start v4 - polished</title>
<style>
:root{--bg:#f6f0e0;--card:#ffffff;--text:#174a2e;--green:#0a7f45;--radius:18px;--shadow:0 12px 28px rgba(0,0,0,.08);--glow:0 8px 20px rgba(10,127,69,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:Inter, system-ui, -apple-system, Arial, sans-serif;color:var(--text)}
.header{position:sticky;top:0;background:rgba(255,255,255,.95);z-index:10;border-bottom:1px solid #eee}
.header .wrap{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand{font-weight:900;letter-spacing:.2px;}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4bdc8b,#28a152);display:inline-block;margin-right:8px}
.main{max-width:860px;margin:18px auto;padding:0 16px}
.screen{display:none;opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease}
.screen.active{display:block;opacity:1;transform:translateY(0)}
.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin:12px 0}
.cardrow{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:stretch}
.card{border-radius:14px;padding:12px;background:#fff;border:1px solid #eee;box-shadow:0 6px 14px #00000008}
.mascot{width:120px;height:auto;align-self:center}
.start-area{text-align:center;padding:8px 0 6px}
.start-area h1{font-size:26px;margin:0 0 8px}
.start-area p{color:#6a6f64;margin:0}
.btn{border-radius:999px;padding:14px 18px;font-weight:900;cursor:pointer;border:0;width:100%}
.btn.primary{background:linear-gradient(135deg,#14c067,#0a7f45);color:#fff;box-shadow:0 6px 14px rgba(12,135,77,.3)}
.btn.secondary{background:#fff;border:1px solid #dcdcc4;color:#1d5b2e}
.btn.ghost{background:#f8f8f8;border:1px solid #e4e4e0;color:#35622b}
.section{display:flex;gap:12px}
.items{display:flex;flex-direction:column;gap:8px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:#fff;box-shadow:0 2px 6px #00000008}
.icon{width:34px;height:34px;border-radius:8px;background:#eef9f0;display:grid;place-items:center}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:22px;font-weight:900;border-radius:12px;background:linear-gradient(135deg,#eafbd3,#fff);}
.price{font-weight:900}
@media (max-width: 900px){.cardrow{grid-template-columns:1fr}.start-area{order:0}.panel{order:2}}
@media (prefers-reduced-motion:no-preference){.screen{transition:opacity .4s ease, transform .4s ease}.screen.active{opacity:1;transform:translateY(0)}}
</style>
</head>
