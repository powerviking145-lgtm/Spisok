<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cart Start - Recovery</title>
<style>
:root{--bg:#f7f0e0;--card:#fff;--text:#173c29;--green:#0a7f45;--radius:18px;--shadow:0 8px 22px rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:Inter, system-ui, -apple-system, Arial, sans-serif;color:var(--text)}
.header{padding:14px 16px;background:rgba(255,255,255,.95);position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.brand{font-weight:800}
.main{max-width:720px;margin:18px auto;padding:0 16px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;}
.cart{display:flex;gap:12px;flex-direction:column}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #eee}
.icon{width:34px;height:34px;border-radius:9px;background:#f0f6ea;display:grid;place-items:center}
.name{font-weight:700}
.price{font-weight:800}
.actions{display:flex;gap:12px;margin-top:8px}
.btn{border-radius:999px;padding:12px 16px;font-weight:800;cursor:pointer;border:0}
.btn.primary{background:linear-gradient(135deg,#0fbf62,#0a7f45);color:white}
.btn.secondary{background:white;border:1px solid #d8e5cc}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-top:8px}
@media (max-width: 700px){.main{padding:0 8px}}
</style>
</head>
<body>
<header class="header"><div class="brand">Cart Recovery</div></header>
<main class="main">
  <section class="card">
    <div class="cart">
      <div class="cart-item"><span class="name">1. Фасоль красная</span><span class="price">139 ₽</span></div>
      <div class="cart-item"><span class="name">2. Макароны</span><span class="price">129 ₽</span></div>
      <div class="cart-item"><span class="name">3. Молоко 3,2%</span><span class="price">89 ₽</span></div>
      <div class="cart-item"><span class="name">4. Печенье</span><span class="price">199 ₽</span></div>
      <div class="cart-item"><span class="name">5. Хлеб зерновой</span><span class="price">99 ₽</span></div>
      <div class="cart-item"><span class="name">6. Соус томатный</span><span class="price">149 ₽</span></div>
      <div class="total"><span>Итого</span><span>804 ₽</span></div>
    </div>
    <div class="actions" style="justify-content:stretch">
      <button class="btn primary" onclick="alert('Заказать доставку')">Заказать доставку</button>
      <button class="btn secondary" onclick="alert('Редактировать корзину')">Редактировать корзину</button>
      <button class="btn primary" onclick="alert('Хочу дешевле')">Хочу дешевле</button>
    </div>
  </section>
  <p class="note" style="text-align:center">Это упрощённая стартовая корзина.</p>
</main>
</body>
</html>
