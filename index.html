const scenarios=[{id:'dinner',name:'Ужин сегодня',icon:'🍽️',cta:'Собрать ужин',count:1},{id:'week',name:'Закупка на неделю',icon:'🛒',cta:'Собрать на неделю',count:4},{id:'country',name:'Дача на выходные',icon:'🏡',cta:'Собрать на дачу',count:2},{id:'guests',name:'Гости дома',icon:'🎉',cta:'Собрать для гостей',count:3},{id:'budget',name:'Корзина до бюджета',icon:'👛',cta:'Собрать по бюджету',count:1},{id:'repeat',name:'Повторить покупку',icon:'↶',cta:'Повторить корзину',count:1}];
const catalog=[{id:'chicken',name:'Куриное филе',unit:'500 г',icon:'🍗',price:349,cheap:279,alt:'Филе «Каждый день»'},{id:'beans',name:'Фасоль красная',unit:'400 г',icon:'🫘',price:139,cheap:109,alt:'Фасоль «Наш выбор»'},{id:'pasta',name:'Макароны',unit:'450 г',icon:'🍝',price:129,cheap:89,alt:'Макароны «Наш выбор»'},{id:'tomato',name:'Помидоры',unit:'500 г',icon:'🍅',price:219,cheap:199,alt:'Помидоры весовые'},{id:'cucumber',name:'Огурцы',unit:'500 г',icon:'🥒',price:159,cheap:139,alt:'Огурцы весовые'},{id:'milk',name:'Молоко 3,2%',unit:'1 л',icon:'🥛',price:89,cheap:79,alt:'Молоко «Наш выбор»'},{id:'cookies',name:'Печенье',unit:'250 г',icon:'🍪',price:199,cheap:159,alt:'Печенье «К чаю»'},{id:'bread',name:'Хлеб зерновой',unit:'400 г',icon:'🍞',price:99,cheap:79,alt:'Хлеб «Зерновой день»'},{id:'sauce',name:'Соус томатный',unit:'300 г',icon:'🥫',price:149,cheap:139,alt:'Соус «Наш выбор»'}];
const questions=[{title:'Готовим на двоих?',card:'На 2 человек',icon:'🍽️',desc:'Достаточно для уютного ужина',yes:'На двоих — принято!',no:'Тогда возьмём на четверых',hint:'Да — 2 человека · Нет — 4 человека'},{title:'Добавим мясо?',card:'Курица для ужина',icon:'🍗',desc:'Филе для твоего любимого блюда',yes:'Отлично, добавлю курицу!',no:'Вместо мяса добавлю фасоль',hint:'Да — курица · Нет — фасоль'},{title:'Нужен гарнир?',card:'Макароны к основному',icon:'🍝',desc:'Простой гарнир, который всем нравится',yes:'Гарнир тоже будет!',no:'Хорошо, без гарнира',hint:'Да — добавим · Нет — пропустим'},{title:'Добавим овощи?',card:'Овощи для салата',icon:'🥗',desc:'Хрустящие огурцы и сочные помидоры',yes:'Сочности много не бывает!',no:'Уберу овощи из списка',hint:'Да — добавим · Нет — пропустим'},{title:'Нужен десерт?',card:'Что-нибудь сладкое к чаю',icon:'🍪',desc:'Маленький приятный финал',yes:'Сладкий финал — готово!',no:'Оставим только самое нужное',hint:'Да — добавим · Нет — пропустим'}];
let state={screen:'home',selected:'dinner',q:0,answers:[],cart:[],cheaper:false,budget:2000},locked=false,loadTimers=[],toastTimer;
const app=document.getElementById('app'),money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',sel=()=>scenarios.find(s=>s.id===state.selected),product=id=>catalog.find(p=>p.id===id);
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
function read(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}
function savedCart(){const c=read('tasty-last-cart');return Array.isArray(c)?c.filter(i=>i&&catalog.some(p=>p.id===i.id)&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=99).map(i=>({id:i.id,qty:i.qty,cheap:!!i.cheap})):[]}
function img(n,cls='',alt='Маскот Вкусного знака'){return `<img class="mascot ${cls}" src="./${n}.png?v=3" alt="${alt}" draggable="false" onerror="this.outerHTML='<span class=&quot;fallback&quot; aria-label=&quot;Помощник&quot;>🛍️</span>'">`}

function feedback(kind='light'){const phone=document.querySelector('.phone');if(phone){phone.classList.remove('vibrating');void phone.offsetWidth;phone.classList.add('vibrating');setTimeout(()=>phone.classList.remove('vibrating'),260)}if('vibrate' in navigator){navigator.vibrate(kind==='medium'?[12,24,12]:8)}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function header(back=true,title=''){return `<header class="topbar">${back?'<button class="round" aria-label="Назад" onclick="goBack()">←</button>':'<div class="brand"><span class="mark">✦</span> Вкусный знак</div>'}${title?`<span class="top-title">${title}</span>`:''}<button class="round" aria-label="На главную" onclick="goHome()">×</button></header>`}
function goHome(){loadTimers.forEach(clearTimeout);loadTimers=[];locked=false;state.screen='home';render()}
function goBack(){if(locked)return;if(state.screen==='questions'&&state.q>0){state.q--;state.answers.pop();render()}else if(['edit','checkout'].includes(state.screen)){state.screen='result';render()}else goHome()}
function render(){app.dataset.screen=state.screen;app.innerHTML=header(state.screen!=='home',state.screen==='questions'?sel().name:'')+`<section class="content">${({home:home,questions:question,loading:loading,result:result,edit:edit,checkout:delivery})[state.screen]()}</section>`;if(state.screen==='questions')bindSwipe();window.scrollTo({top:0,behavior:'instant'})}

function choose(id){feedback();state.selected=id;render()}
function home(){return `<div class="home-screen"><div class="home-intro"><div><span class="badge">✦ Твой помощник по покупкам</span><h1>Твои планы.<em>Моя корзина!</em></h1><p class="sub">Пять ответов — и всё вкусное уже подобрано.</p></div>${img(1)}<span class="star" aria-hidden="true">✦</span></div><div class="eyebrow">Что у тебя в планах?<span>Выбери сценарий</span></div><div class="scenarios">${scenarios.map(s=>`<button class="scenario ${state.selected===s.id?'selected':''}" aria-pressed="${state.selected===s.id}" onclick="choose('${s.id}')"><span class="emoji" aria-hidden="true">${s.icon}</span><b>${s.name}</b></button>`).join('')}</div>${state.selected==='budget'?`<div class="budget"><label for="budget">Сколько потратим на продукты?</label><input id="budget" type="number" min="500" max="50000" step="100" value="${state.budget}" onchange="state.budget=Number(this.value)" aria-label="Бюджет в рублях"></div>`:''}${state.selected==='repeat'?`<p class="fine">${savedCart().length?'Твоя последняя корзина уже ждёт.':'Первая корзина сохранится после перехода к доставке.'}</p>`:''}<div class="home-cta"><button class="btn primary" onclick="start()">${sel().cta}<span class="arrow" aria-hidden="true">→</span></button><p class="fine">Без списков и долгого поиска. С заботой о тебе.</p></div></div>`}

function start(){feedback();if(state.selected==='budget'&&(!Number.isFinite(state.budget)||state.budget<500||state.budget>50000)){toast('Укажи бюджет от 500 до 50 000 ₽');return}state.cheaper=false;state.answers=[];state.q=0;if(state.selected==='repeat'&&savedCart().length){state.cart=savedCart();state.cheaper=state.cart.some(i=>i.cheap);state.screen='result';render();toast('Вернули твою последнюю корзину');return}state.screen='questions';render()}
function question(){const q=questions[state.q];return `<div class="progress-label"><b>Вопрос ${state.q+1} из 5</b><span>Твоя корзина становится ближе</span></div><div class="progress">${questions.map((_,i)=>`<i class="${i<=state.q?'on':''}"></i>`).join('')}</div><div class="question-head"><h2>${q.title}</h2><p>${state.q===0&&sel().count>1?`Продукты на двоих, запас ×${sel().count} для сценария «${sel().name}».`:q.hint}</p></div><div class="deck"><div class="swipe-card" id="swipe-card" tabindex="0" role="group" aria-label="${q.card}. Стрелка влево — нет, вправо — да"><div class="art"><span class="bigemoji">${q.icon}</span><span class="spark">✦</span></div><h3>${q.card}</h3><small>${q.desc}</small><div class="stamp" id="stamp">ДА</div></div></div><div class="question-mascot"><div class="bubble" id="reaction">Свайпни карточку.<br>Вправо — да, влево — нет.</div>${img(2,'','Маскот поддерживает твой выбор')}</div><div class="swipe-actions"><button class="btn no" onclick="answer(false)">× Нет</button><button class="btn yes" onclick="answer(true)">✓ Да</button></div><p class="swipe-hint">Можно свайпать, нажимать кнопки или использовать ← →</p>`}
function bindSwipe(){const card=document.getElementById('swipe-card');let startX=0,startY=0,active=false,dx=0;card.addEventListener('pointerdown',e=>{if(locked)return;startX=e.clientX;startY=e.clientY;dx=0;active=true;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!active||locked)return;dx=e.clientX-startX;if(Math.abs(e.clientY-startY)>Math.abs(dx)+25){active=false;reset();return}card.style.transform=`translateX(${dx}px) rotate(${dx/19}deg)`;const stamp=document.getElementById('stamp');stamp.style.display=Math.abs(dx)>20?'block':'none';stamp.textContent=dx>0?'ДА':'НЕТ';stamp.style.color=dx>0?'#137547':'#cc644f';stamp.style.borderColor=dx>0?'#137547':'#cc644f'});function reset(){card.style.transform='';document.getElementById('stamp').style.display='none'}card.addEventListener('pointerup',()=>{if(!active)return;active=false;if(Math.abs(dx)>70)answer(dx>0);else reset()});card.addEventListener('pointercancel',()=>{active=false;reset()})}
function answer(yes){if(state.screen!=='questions'||locked)return;feedback('medium');locked=true;const q=questions[state.q],card=document.getElementById('swipe-card');document.querySelectorAll('.swipe-actions button').forEach(b=>b.disabled=true);document.getElementById('reaction').textContent=yes?q.yes:q.no;document.getElementById('reaction').classList.add('cheer');card.style.transition='transform .32s ease, opacity .32s';card.style.transform=`translateX(${yes?400:-400}px) rotate(${yes?20:-20}deg)`;card.style.opacity='0';state.answers[state.q]=yes;loadTimers.push(setTimeout(()=>{locked=false;if(state.q<4){state.q++;render()}else beginLoading()},500))}
window.addEventListener('keydown',e=>{if(state.screen==='questions'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();answer(e.key==='ArrowRight')}});
function beginLoading(){state.screen='loading';render();[1300,2800,4300].forEach((t,i)=>loadTimers.push(setTimeout(()=>{document.querySelectorAll('.step').forEach((el,j)=>{el.className='step '+(j<=i?'done':j===i+1?'active':'');el.querySelector('i').textContent=j<=i?'✓':''});if(i===2){buildCart();state.screen='result';render()}},t)))}
function loading(){return `<div class="loading" role="status"><span class="badge">✦ Собираем вкусное вместе</span><h1>Твоя корзина<br><em>почти готова</em></h1><p class="sub">Добавляю любимое, подбираю выгодное.<br>Ничего лишнего — всё по твоим ответам.</p><div class="orb">${img(1)}<span class="orbit-item a" aria-hidden="true">🥑</span><span class="orbit-item b" aria-hidden="true">🍅</span><span class="orbit-item c" aria-hidden="true">🍞</span></div><div class="steps">${['Подбираем продукты','Сравниваем цены','Считаем итог'].map((s,i)=>`<div class="step ${i===0?'active':''}"><i></i><span>${s}</span></div>`).join('')}</div><div class="load-track" aria-hidden="true"></div><p class="fine">Ещё чуть-чуть — и можно к столу.</p></div>`}

function buildCart(){const a=state.answers,mult=sel().count*(a[0]?1:2);let ids=[a[1]?'chicken':'beans',...(a[2]?['pasta']:[]),...(a[3]?['tomato','cucumber']:[]),'milk',...(a[4]?['cookies']:[]),'bread','sauce'];state.cart=ids.map(id=>({id,qty:mult,cheap:false}));if(state.selected==='budget'&&total()>state.budget){state.cart.forEach(i=>i.cheap=true);while(total()>state.budget&&state.cart.some(i=>i.qty>1)){state.cart.find(i=>i.qty>1).qty--}const order=['cookies','sauce','milk','cucumber','tomato','bread','pasta'];for(const id of order){if(total()<=state.budget)break;state.cart=state.cart.filter(i=>i.id!==id)}state.cheaper=true}}
function total(original=false){return state.cart.reduce((s,i)=>s+(original||!i.cheap?product(i.id).price:product(i.id).cheap)*i.qty,0)}
function quantity(){return state.cart.reduce((s,i)=>s+i.qty,0)}
function row(i,editable=false){const p=product(i.id);return `<div class="product"><span class="prod-icon">${p.icon}</span><div class="prod-info"><b>${i.cheap?p.alt:p.name}</b><small>${p.unit} · ${i.qty} шт.${i.cheap?' · выгодный аналог':''}</small>${editable?`<div class="qty"><button aria-label="Уменьшить ${p.name}" onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button aria-label="Увеличить ${p.name}" onclick="changeQty('${i.id}',1)">+</button><button class="remove" onclick="removeItem('${i.id}')">Убрать</button></div>`:''}</div><div class="price">${i.cheap?`<del>${money(p.price*i.qty)}</del>`:''}<b>${money((i.cheap?p.cheap:p.price)*i.qty)}</b>${editable&&i.cheap?`<br><button class="link" style="padding:6px 0;font-size:10px" onclick="restoreItem('${i.id}')">Оригинал</button>`:''}</div></div>`}
function result(){const saving=total(true)-total();return `<span class="badge">✓ ${state.cheaper?'Нашли более выгодные варианты':'Готово! Корзина собрана'}</span><div class="result-hero"><div><h1>${state.cheaper?'Та же корзина,<br>но дешевле':'Всё нужное.<br>Уже в корзине.'}</h1><p>${sel().name} · ${quantity()} шт.</p></div>${img(3)}</div>${state.cheaper?`<div class="compare"><div><small>Было</small><strong class="was">${money(total(true))}</strong></div><span>→</span><div><small>Стало</small><strong>${money(total())}</strong></div></div>`:'<p class="sub">Собрали по твоим ответам.<br>Любой товар можно заменить или убрать.</p>'}${state.selected==='budget'?`<p class="sub">Бюджет ${money(state.budget)} · ${total()<=state.budget?'Уложились! Состав сокращён при необходимости.':'Корзина превышает бюджет после редактирования.'}</p>`:''}<div class="list">${state.cart.length?state.cart.map(i=>row(i)).join(''):'<p class="empty">Добавим что-нибудь вкусное?</p>'}<div class="total"><span>Итого</span><span>${money(total())}</span></div></div>${state.cheaper?`<div class="saving">Экономия ${money(saving)}</div>`:''}<div class="result-helper">${img(4)}<div class="bubble">${state.cheaper?'Те же категории и объём.<br>Более приятная цена!':'Я всё собрал!<br>Но могу сделать дешевле ✦'}</div></div><div class="actions">${!state.cheaper?'<button class="btn lime" onclick="makeCheaper()" '+(!state.cart.length?'disabled':'')+'>↓ Хочу дешевле</button>':'<button class="link" onclick="restoreAll()">Вернуть оригинальные товары</button>'}<button class="btn ghost" onclick="state.screen=\'edit\';render()">Редактировать корзину</button><button class="btn primary" onclick="checkout()" ${state.cart.length?'':'disabled'}>Заказать доставку · ${money(total())}</button></div><p class="fine">Стоимость товаров без доставки.</p>`}
function makeCheaper(){if(!state.cart.length)return;feedback('medium');state.cart.forEach(i=>i.cheap=true);state.cheaper=true;render();toast('Подобрали более доступные аналоги')}
function restoreAll(){state.cart.forEach(i=>i.cheap=false);state.cheaper=false;render();toast('Вернули оригинальные товары')}
function restoreItem(id){state.cart.find(i=>i.id===id).cheap=false;state.cheaper=state.cart.some(i=>i.cheap);render()}
function edit(){return `<span class="badge">Твоя корзина — твои правила</span><h1>Оставим<br>самое нужное</h1><p class="sub">Меняй количество, убирай лишнее<br>или добавляй продукты из каталога.</p><div class="list">${state.cart.length?state.cart.map(i=>row(i,true)).join(''):'<p class="empty">Добавим что-нибудь вкусное?</p>'}<div class="total"><span>Итого</span><span>${money(total())}</span></div></div><div class="section-title"><b>Добавить в корзину</b><span>Каталог</span></div><div class="list">${catalog.filter(p=>!state.cart.some(i=>i.id===p.id)).map(p=>`<div class="product"><span class="prod-icon">${p.icon}</span><div class="prod-info"><b>${p.name}</b><small>${p.unit} · ${money(state.cheaper?p.cheap:p.price)}</small></div><button class="round" aria-label="Добавить ${p.name}" onclick="addItem('${p.id}')">+</button></div>`).join('')||'<p class="fine">Все товары уже в корзине</p>'}</div><div class="actions"><button class="btn primary" onclick="state.screen=\'result\';render()">Сохранить изменения</button></div>`}
function changeQty(id,delta){const i=state.cart.find(i=>i.id===id);if(i.qty+delta>99)return;i.qty+=delta;if(i.qty<=0)state.cart=state.cart.filter(i=>i.id!==id);render()}
function removeItem(id){state.cart=state.cart.filter(i=>i.id!==id);render()}
function addItem(id){state.cart.push({id,qty:1,cheap:state.cheaper});render()}
function checkout(){if(!state.cart.length)return;save('tasty-last-cart',state.cart);const payload={scenario:state.selected,items:state.cart.map(i=>({...i,name:i.cheap?product(i.id).alt:product(i.id).name,unitPrice:i.cheap?product(i.id).cheap:product(i.id).price})),total:total(),currency:'RUB'};try{sessionStorage.setItem('tasty-checkout',JSON.stringify(payload))}catch(e){}window.dispatchEvent(new CustomEvent('tasty-cart-ready',{detail:payload}));if(APP_CHECKOUT_URL){window.location.assign(APP_CHECKOUT_URL);return}state.screen='checkout';render()}
function delivery(){return `<span class="badge">✓ Корзина сохранена</span><h1>Всё вкусное<br><em>уже выбрано</em></h1><div class="hero">${img(3)}<div class="bubble">Твоя корзина на месте.<br>К ней всегда можно вернуться!</div></div><div class="list"><div class="product"><div class="prod-info"><b>${sel().name}</b><small>${quantity()} шт. · без стоимости доставки</small></div><strong>${money(total())}</strong></div></div><div class="delivery-note">Оформление доставки пока недоступно. Заказ ещё не отправлен — выбранные товары сохранены на этом устройстве.</div><button class="btn primary" onclick="state.screen='result';render()">Вернуться к корзине</button><button class="btn ghost back-home" onclick="goHome()">Собрать ещё одну</button>`}

render();
</script></body></html>
